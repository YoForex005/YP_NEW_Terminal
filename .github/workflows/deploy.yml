name: CI/CD for YP_NEW_Terminal

on:
  push:
    branches:
      - main

concurrency:
  group: YP-Terminal-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 20m

          script: |
            set -Eeuo pipefail

            APP_DIR="/home/ubuntu/YP_NEW_Terminal"
            COMMIT_SHA="${{ github.sha }}"

            cd "$APP_DIR"

            # Save currently deployed commit before changing anything.
            PREVIOUS_COMMIT="$(git rev-parse HEAD)"

            rollback() {
              echo "========================================"
              echo "DEPLOYMENT FAILED - STARTING ROLLBACK"
              echo "========================================"
              echo "Rolling back to: $PREVIOUS_COMMIT"

              # Prevent rollback errors from causing another trap invocation.
              trap - ERR
              set +e

              cd "$APP_DIR"

              git reset --hard "$PREVIOUS_COMMIT"

              echo "Installing dependencies for previous version..."
              npm ci

              echo "Building previous version..."
              npm run build

              echo "Restarting PM2 with previous version..."
              pm2 restart yopips-terminal --update-env

              pm2 save

              echo "========================================"
              echo "ROLLBACK COMPLETED"
              echo "Restored commit: $PREVIOUS_COMMIT"
              echo "========================================"
            }

            trap rollback ERR

            echo "========================================"
            echo "Starting deployment"
            echo "Previous commit: $PREVIOUS_COMMIT"
            echo "New commit: $COMMIT_SHA"
            echo "========================================"

            echo "Fetching latest commit..."
            git fetch origin

            echo "Checking out $COMMIT_SHA..."
            git reset --hard "$COMMIT_SHA"

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js application..."
            npm run build

            echo "Restarting PM2 application..."
            pm2 restart yopips-terminal --update-env

            pm2 save

            # Deployment succeeded, so disable rollback trap.
            trap - ERR

            echo "========================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "Deployed commit: $COMMIT_SHA"
            echo "========================================"