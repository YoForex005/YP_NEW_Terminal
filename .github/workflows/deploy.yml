name: CI/CD for Yopips-terminal

on:
  push:
    branches:
      - main

concurrency:
  group: yp-terminal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release ID
        id: release
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release archive
        shell: bash
        run: |
          set -Eeuo pipefail

          SHA="${{ steps.release.outputs.sha }}"

          echo "Creating release: $SHA"

          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.env \
            --exclude=.env.local \
            --exclude=.env.production \
            --exclude=.env.production.local \
            --exclude=node_modules \
            --exclude=.next \
            -czf "yopips-terminal-$SHA.tar.gz" .

          ls -lh "yopips-terminal-$SHA.tar.gz"

      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: yopips-terminal-${{ steps.release.outputs.sha }}.tar.gz
          target: /tmp/
          overwrite: true

      - name: Deploy release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            sudo -u yopips-terminal /usr/local/sbin/deploy-yopips-terminal \
              '/tmp/yopips-terminal-${{ steps.release.outputs.sha }}.tar.gz' \
              '${{ steps.release.outputs.sha }}'

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            echo 'Active release:'
            readlink -f /opt/yopips-terminal/current
            echo 'PM2:'
            sudo -u yopips-terminal pm2 status yopips-terminal

      - name: Health check
        shell: bash
        run: |
          set -Eeuo pipefail

          curl \
            --fail \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            https://terminal.yopips.com/api/node-bridge/health

          echo "Production health check passed."

      - name: Cleanup uploaded archive
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            rm -f '/tmp/yopips-terminal-${{ steps.release.outputs.sha }}.tar.gz'
