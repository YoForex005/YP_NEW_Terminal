name: CI/CD for Yopips-terminal

on:
  push:
    branches:
      - main

concurrency:
group: yp-terminal
cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          command_timeout: 20m

          script: |
            set -Eeuo pipefail

            APP_DIR="/opt/yopips-terminal/current"
            COMMIT_SHA="${{ github.sha }}"
            PM2_NAME="yopips-terminal"

            rollback() {
              echo "Deployment failed. Rolling back..."

              cd "$APP_DIR"

              git reset --hard "$PREVIOUS_SHA"

              echo "Restarting previous version..."
              pm2 restart "$PM2_NAME" --update-env
              pm2 save

              echo "Rollback completed."
              echo "Running commit: $(git rev-parse HEAD)"
            }

            trap rollback ERR

            cd "$APP_DIR"

            echo "Current commit:"
            git rev-parse HEAD

            PREVIOUS_SHA="$(git rev-parse HEAD)"

            echo "Previous commit: $PREVIOUS_SHA"
            echo "Deploying commit: $COMMIT_SHA"

            echo "Fetching latest commit..."
            git fetch origin

            echo "Updating application..."
            git reset --hard "$COMMIT_SHA"

            echo "Installing dependencies..."
            npm ci

            echo "Building Next.js application..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart "$PM2_NAME" --update-env

            pm2 save

            trap - ERR

            echo "======================================"
            echo "Deployment successful"
            echo "Commit: $(git rev-parse HEAD)"
            echo "======================================"