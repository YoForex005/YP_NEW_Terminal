name: CI/CD for Yopips-terminal

on:
  push:
    branches:
      - main

concurrency:
  group: yp-terminal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Package release
        shell: bash
        run: |
          set -Eeuo pipefail

          ARCHIVE="yopips-terminal-${GITHUB_SHA}.tar.gz"
          mkdir -p .deploy

          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.deploy \
            --exclude=.env \
            --exclude=.env.local \
            --exclude=.env.production \
            --exclude=.env.production.local \
            --exclude=node_modules \
            --exclude=.next \
            -czf ".deploy/$ARCHIVE" .

          ls -lh ".deploy/$ARCHIVE"

      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: .deploy/yopips-terminal-${{ github.sha }}.tar.gz
          target: /tmp/
          strip_components: 1
          overwrite: true

      - name: Deploy release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -eu
            archive='/tmp/yopips-terminal-${{ github.sha }}.tar.gz'
            trap 'rm -f "$archive"' EXIT

            sudo -u yopips-terminal /usr/local/sbin/deploy-yopips-terminal \
              "$archive" \
              '${{ github.sha }}'

            sudo -u yopips-terminal pm2 status yopips-terminal
            curl --fail --retry 10 --retry-delay 3 http://127.0.0.1:3012/api/node-bridge/health
