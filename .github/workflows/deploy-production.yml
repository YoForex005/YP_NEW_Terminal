name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.ENABLE_AUTO_PRODUCTION_DEPLOY == 'true' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://terminal.yopips.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve release ID
        id: release
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create source artifact
        shell: bash
        run: >-
          tar --exclude=.git --exclude=.github --exclude=.env --exclude=.env.local
          --exclude=.env.production --exclude=node_modules --exclude=.next
          -czf "/tmp/yopips-terminal-${{ steps.release.outputs.sha }}.tar.gz" .
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts
      - name: Upload release
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        run: scp -P "${PORT:-22}" "/tmp/yopips-terminal-$SHA.tar.gz" "$USER@$HOST:/tmp/"
      - name: Update production environment variables
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          ssh -p "${PORT:-22}" "$USER@$HOST" \
            "sudo sed -i 's/api\.yopips\.com/backend.yopips.com/g' /opt/yopips-terminal/shared/.env.production"
      - name: Activate and verify release
        env:
          HOST: ${{ secrets.PROD_SSH_HOST }}
          PORT: ${{ secrets.PROD_SSH_PORT }}
          USER: ${{ secrets.PROD_SSH_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          ssh -p "${PORT:-22}" "$USER@$HOST" \
            "sudo -u yopips-terminal /usr/local/sbin/deploy-yopips-terminal '/tmp/yopips-terminal-$SHA.tar.gz' '$SHA'"
          curl --fail --retry 10 --retry-delay 3 --retry-all-errors \
            https://terminal.yopips.com/api/node-bridge/health
