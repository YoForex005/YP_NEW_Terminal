name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      CI: "true"
      REDIS_URL: redis://127.0.0.1:6379
      TERMINAL_API_BASE: http://127.0.0.1:3001
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_TERMINAL_API_BASE: proxy
      NEXT_PUBLIC_TERMINAL_WS_BASE: ws://127.0.0.1:3001
      NEXT_PUBLIC_TERMINAL_TRADE_DRY_RUN: "true"
      NEXT_PUBLIC_ENABLE_REAL_TRADING: "false"
      NEXT_PUBLIC_WS_URL: /ws
      CPP_REALTIME_WS_URL: ws://127.0.0.1:3003
      WEBTRADER_TOKEN_SECRET: ci-only-not-for-production
      DEV_AUTO_AUTH: "false"
      DEV_AUTO_PROVISION_USERS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
